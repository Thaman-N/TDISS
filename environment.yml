#current, blackwell arch. supports compute capability above sm_90 (blackwell:sm_120)
name: violence_detect
channels:
  - conda-forge
  - anaconda
  - defaults
dependencies:
  - python=3.11
  - numpy=1.26.4
  - opencv=4.9.0
  - flask=3.0.0
  - werkzeug=3.0.1
  - pillow=10.2.0
  - matplotlib=3.8.2
  - scikit-learn=1.4.0
  - scipy=1.12.0
  - pip
  - pip:

    - tqdm==4.66.1
    - albumentations==1.4.0
    - seaborn==0.13.2
    - ultralytics==8.1.0
    - opencv-python==4.9.0.80

